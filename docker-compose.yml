version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pvfc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pvfc_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pvfc_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-pvfc_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pvfc_admin} -d ${POSTGRES_DB:-pvfc_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pvfc_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pvfc_admin}:${POSTGRES_PASSWORD:-pvfc_secret_pass}@db:5432/${POSTGRES_DB:-pvfc_db}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./contracts:/app/contracts:ro
      - ./data:/app/data:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pvfc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
