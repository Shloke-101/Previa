# Render Blueprint Specification for Previa Frontend (Web Service)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # Frontend Web Service (Next.js + Node)
  # ---------------------------------------------------------------------------
  - type: web
    name: previa-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        value: https://previa-priz.onrender.com
