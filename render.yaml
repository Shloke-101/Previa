# Render Blueprint Specification for Previa (PVFC)
# Pre-Visit Financial Clearance System
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API Web Service (FastAPI + Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: previa-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: previa-postgres
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (Vite Single Page Application)
  # ---------------------------------------------------------------------------
  - type: static_site
    name: previa-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build:vite
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: previa-backend
          property: host

# -----------------------------------------------------------------------------
# Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: previa-postgres
    databaseName: pvfc_db
    user: pvfc_admin
    plan: free
    region: oregon
    postgresMajorVersion: 15
