# Render Blueprint Specification for Previa (PVFC)
# Pre-Visit Financial Clearance System
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend REST API Service (FastAPI + Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: previa-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: previa-postgres
          property: connectionString

  # ---------------------------------------------------------------------------
  # 2. Frontend Web Application (Next.js + Node)
  # ---------------------------------------------------------------------------
  - type: web
    name: previa-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: previa-backend
          property: host

# -----------------------------------------------------------------------------
# Managed PostgreSQL Database
# -----------------------------------------------------------------------------
databases:
  - name: previa-postgres
    databaseName: pvfc_db
    user: pvfc_admin
    plan: free
    region: oregon
    postgresMajorVersion: 15
